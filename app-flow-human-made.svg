<svg width="1600" height="1040" viewBox="0 0 1600 1040" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1040" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7F3EC"/>
      <stop offset="1" stop-color="#EEE6D8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#F7F1E7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#8C7B6A" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto-start-reverse">
      <path d="M1 1L11 7L1 13" stroke="#7E5C45" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #2F241B; }
      .subtitle { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: #6F6258; }
      .group-title { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #45352A; letter-spacing: 0.6px; }
      .box-title { font: 700 17px 'Segoe UI', Arial, sans-serif; fill: #2E251E; }
      .box-text { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #5E544C; }
      .small { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #5C4B3F; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #6C625C; }
      .chip { font: 700 11px 'Segoe UI', Arial, sans-serif; fill: #6A513E; letter-spacing: 0.8px; }
      .arrow-label { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #7B6552; }
    </style>
  </defs>

  <rect width="1600" height="1040" rx="28" fill="url(#bg)"/>

  <text x="70" y="68" class="title">LLM Gateway App Flow</text>
  <text x="70" y="95" class="subtitle">Insurance claim processing with PII masking, routing, fallback, cache, logging, and dashboard analytics</text>

  <!-- Section frames -->
  <rect x="56" y="128" width="290" height="826" rx="26" fill="#F5ECE0" stroke="#D7C3AE" stroke-width="2"/>
  <rect x="382" y="128" width="498" height="826" rx="26" fill="#F8F0E6" stroke="#D7C3AE" stroke-width="2"/>
  <rect x="916" y="128" width="330" height="826" rx="26" fill="#F5ECE0" stroke="#D7C3AE" stroke-width="2"/>
  <rect x="1278" y="128" width="266" height="826" rx="26" fill="#F8F0E6" stroke="#D7C3AE" stroke-width="2"/>

  <text x="82" y="164" class="group-title">1. User + Frontend</text>
  <text x="410" y="164" class="group-title">2. FastAPI + Gateway Pipeline</text>
  <text x="944" y="164" class="group-title">3. Model Providers</text>
  <text x="1306" y="164" class="group-title">4. Storage + Dashboard</text>

  <!-- Left column -->
  <g filter="url(#shadow)">
    <rect x="84" y="202" width="236" height="90" rx="22" fill="url(#panel)" stroke="#C8AE95" stroke-width="2.2"/>
    <text x="108" y="236" class="box-title">User</text>
    <text x="108" y="260" class="box-text">Submits claim summary request</text>
    <text x="108" y="280" class="box-text">and reviews result in browser</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="84" y="336" width="236" height="160" rx="22" fill="url(#panel)" stroke="#C8AE95" stroke-width="2.2"/>
    <text x="108" y="370" class="box-title">Frontend UI</text>
    <text x="108" y="394" class="box-text">HTML / JS single-page app</text>
    <text x="108" y="418" class="box-text">• Submit claim</text>
    <text x="108" y="438" class="box-text">• View pipeline + metrics</text>
    <text x="108" y="458" class="box-text">• Explainability panel</text>
    <text x="108" y="478" class="box-text">• Clear old / recent requests</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="84" y="546" width="236" height="172" rx="22" fill="url(#panel)" stroke="#C8AE95" stroke-width="2.2"/>
    <text x="108" y="580" class="box-title">API Calls from UI</text>
    <text x="108" y="604" class="box-text">POST /api/claim</text>
    <text x="108" y="624" class="box-text">GET /api/stats</text>
    <text x="108" y="644" class="box-text">GET /api/teams</text>
    <text x="108" y="664" class="box-text">GET /api/models</text>
    <text x="108" y="684" class="box-text">GET /api/recent</text>
    <text x="108" y="704" class="box-text">DELETE /api/recent</text>
  </g>

  <!-- Middle column -->
  <g filter="url(#shadow)">
    <rect x="412" y="202" width="438" height="74" rx="20" fill="url(#panel)" stroke="#BEA184" stroke-width="2.2"/>
    <text x="438" y="246" class="box-title">FastAPI Backend</text>
    <text x="612" y="246" class="box-text">receives request and returns JSON response</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="438" y="312" width="386" height="74" rx="18" fill="#FFF9F2" stroke="#CDAA8E" stroke-width="2"/>
    <text x="462" y="340" class="chip">STEP 1</text>
    <text x="462" y="365" class="box-title">PII Masking</text>
    <text x="604" y="365" class="box-text">email, phone, SSN, PAN, Aadhaar redacted</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="438" y="416" width="386" height="82" rx="18" fill="#FFF9F2" stroke="#CDAA8E" stroke-width="2"/>
    <text x="462" y="444" class="chip">STEP 2</text>
    <text x="462" y="469" class="box-title">Task Classification</text>
    <text x="462" y="490" class="box-text">Detect simple vs complex and estimate tokens</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="438" y="528" width="386" height="82" rx="18" fill="#FFF9F2" stroke="#CDAA8E" stroke-width="2"/>
    <text x="462" y="556" class="chip">STEP 3</text>
    <text x="462" y="581" class="box-title">Cache Lookup</text>
    <text x="462" y="602" class="box-text">If masked claim exists, return cached summary at $0 cost</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="438" y="640" width="386" height="82" rx="18" fill="#FFF9F2" stroke="#CDAA8E" stroke-width="2"/>
    <text x="462" y="668" class="chip">STEP 4</text>
    <text x="462" y="693" class="box-title">Model Routing</text>
    <text x="462" y="714" class="box-text">Cheap model for simple claims, premium model for complex ones</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="438" y="752" width="386" height="88" rx="18" fill="#FFF9F2" stroke="#CDAA8E" stroke-width="2"/>
    <text x="462" y="780" class="chip">STEP 5</text>
    <text x="462" y="805" class="box-title">Fallback + Response</text>
    <text x="462" y="826" class="box-text">If primary model fails, gateway retries fallback chain</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="438" y="870" width="386" height="56" rx="18" fill="#FFF9F2" stroke="#CDAA8E" stroke-width="2"/>
    <text x="462" y="904" class="box-title">Cost, Explainability, Logging</text>
  </g>

  <!-- Right providers -->
  <g filter="url(#shadow)">
    <rect x="948" y="232" width="266" height="120" rx="22" fill="url(#panel)" stroke="#B99A84" stroke-width="2.2"/>
    <text x="974" y="266" class="box-title">Azure OpenAI</text>
    <text x="974" y="290" class="box-text">Primary for simple claims</text>
    <text x="974" y="310" class="small">azure/gpt-4o-mini</text>
    <text x="974" y="334" class="box-text">Low cost, good for routine summaries</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="948" y="404" width="266" height="128" rx="22" fill="url(#panel)" stroke="#B99A84" stroke-width="2.2"/>
    <text x="974" y="438" class="box-title">Azure OpenAI</text>
    <text x="974" y="462" class="box-text">Primary for complex claims</text>
    <text x="974" y="482" class="small">azure/gpt-4o</text>
    <text x="974" y="506" class="box-text">Higher accuracy for medical / legal / multi-party cases</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="948" y="588" width="266" height="120" rx="22" fill="url(#panel)" stroke="#B99A84" stroke-width="2.2"/>
    <text x="974" y="622" class="box-title">Fallback Provider</text>
    <text x="974" y="646" class="box-text">Groq Llama 3.3</text>
    <text x="974" y="670" class="box-text">Used when Azure primary is unavailable</text>
  </g>

  <!-- Storage and dashboard -->
  <g filter="url(#shadow)">
    <rect x="1310" y="240" width="202" height="116" rx="22" fill="url(#panel)" stroke="#B99A84" stroke-width="2.2"/>
    <text x="1336" y="274" class="box-title">SQLite Cache</text>
    <text x="1336" y="298" class="box-text">response_cache</text>
    <text x="1336" y="322" class="box-text">Stores masked-input summaries</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1310" y="410" width="202" height="136" rx="22" fill="url(#panel)" stroke="#B99A84" stroke-width="2.2"/>
    <text x="1336" y="444" class="box-title">SQLite Logs</text>
    <text x="1336" y="468" class="box-text">request_logs</text>
    <text x="1336" y="492" class="box-text">tokens, cost, latency,</text>
    <text x="1336" y="512" class="box-text">provider, fallback, cache, team</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1310" y="616" width="202" height="164" rx="22" fill="url(#panel)" stroke="#B99A84" stroke-width="2.2"/>
    <text x="1336" y="650" class="box-title">Live Dashboard</text>
    <text x="1336" y="674" class="box-text">• Total requests</text>
    <text x="1336" y="694" class="box-text">• Team budgets</text>
    <text x="1336" y="714" class="box-text">• Model usage</text>
    <text x="1336" y="734" class="box-text">• Cache hit rate</text>
    <text x="1336" y="754" class="box-text">• Recent requests</text>
  </g>

  <!-- Connectors -->
  <path d="M320 247C354 247 364 239 396 239" stroke="#7E5C45" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="332" y="230" class="arrow-label">browser request</text>

  <path d="M581 276V312" stroke="#7E5C45" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M631 386V416" stroke="#7E5C45" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M631 498V528" stroke="#7E5C45" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M631 610V640" stroke="#7E5C45" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M631 722V752" stroke="#7E5C45" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M631 840V870" stroke="#7E5C45" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <path d="M824 682C892 682 888 292 948 292" stroke="#7E5C45" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="842" y="654" class="arrow-label">simple route</text>

  <path d="M824 690C894 690 892 468 948 468" stroke="#7E5C45" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="842" y="707" class="arrow-label">complex route</text>

  <path d="M824 796C886 796 892 648 948 648" stroke="#7E5C45" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="846" y="816" class="arrow-label">fallback if needed</text>

  <path d="M1214 292C1270 292 1268 292 1310 292" stroke="#7E5C45" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M1214 470C1270 470 1268 470 1310 470" stroke="#7E5C45" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M824 898C1056 898 1182 470 1310 470" stroke="#7E5C45" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="968" y="880" class="arrow-label">log every request</text>

  <path d="M824 570C990 570 1130 292 1310 292" stroke="#B3967F" stroke-width="2.6" fill="none" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="976" y="548" class="arrow-label">cache lookup / write</text>

  <path d="M1412 546V616" stroke="#7E5C45" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="1422" y="586" class="arrow-label">analytics</text>

  <path d="M1512 698C1550 698 1550 860 1040 860C724 860 596 860 320 860C188 860 188 498 188 498" stroke="#7E5C45" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/>
  <text x="1188" y="842" class="arrow-label">dashboard + summary back to UI</text>

  <!-- Decorative handwritten notes -->
  <g transform="rotate(-3 1110 830)">
    <rect x="1010" y="800" width="196" height="84" rx="16" fill="#FFF3B9" stroke="#D0B25A" stroke-width="2"/>
    <text x="1030" y="832" class="small">Why this feels production-ready:</text>
    <text x="1030" y="854" class="tiny">PII guardrails + smart routing +</text>
    <text x="1030" y="872" class="tiny">cost visibility + zero-downtime fallback</text>
  </g>
</svg>
